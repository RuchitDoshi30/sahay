<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sahay — NSFDC Scheme Recommendation & Channel Partner Guidance Platform. Find the right government scheme, understand your loan estimate, and reach verified Channel Partners." />
    <title>Sahay | NSFDC Scheme Guidance</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🟢</text></svg>" />
  </head>
  <body>
    <div id="root"></div>
    <div id="google_translate_element" style="display:none"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'en',
          includedLanguages: 'en,hi,gu,mr,ta,te,bn,pa',
          autoDisplay: false
        }, 'google_translate_element');
      }

      // Suppress Google Translate top banner bar and prevent page layout shift
      (function() {
        var suppressBanner = function() {
          if (document.body && document.body.style.top && document.body.style.top !== '0px') {
            document.body.style.top = '0px';
          }
          var banners = document.querySelectorAll('.goog-te-banner-frame, .VIpgJd-ZVi9od-aZ2wEe-wOHMyf, body > .skiptranslate, iframe[class*="goog-te-banner"]');
          for (var i = 0; i < banners.length; i++) {
            banners[i].style.setProperty('display', 'none', 'important');
            banners[i].style.setProperty('visibility', 'hidden', 'important');
            banners[i].style.setProperty('height', '0px', 'important');
          }
        };

        if (window.MutationObserver) {
          var observer = new MutationObserver(suppressBanner);
          observer.observe(document.documentElement, {
            attributes: true,
            childList: true,
            subtree: true,
            attributeFilter: ['style', 'class']
          });
        }
        window.addEventListener('load', suppressBanner);
      })();
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
